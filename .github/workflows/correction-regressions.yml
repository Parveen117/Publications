name: Prerequisite correction regressions
on:
  pull_request:
    paths:
      - 'papers/corrections-2026-09-25/**'
      - 'papers/information-invariance/**'
      - '.github/workflows/correction-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'papers/corrections-2026-09-25/**'
      - 'papers/information-invariance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q papers/information-invariance/tests
      - run: python certificate.py --check && python -m unittest test_certificate -v
        working-directory: papers/corrections-2026-09-25
