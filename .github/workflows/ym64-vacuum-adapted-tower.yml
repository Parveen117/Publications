name: YM64 vacuum adapted blocking and response tower

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/generalized-euler-evolution/GE4_MINIMAL_OBSERVER_MEMORY.md'
      - '.github/workflows/ym64-vacuum-adapted-tower.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/generalized-euler-evolution/GE4_MINIMAL_OBSERVER_MEMORY.md'
      - '.github/workflows/ym64-vacuum-adapted-tower.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce adapted cut and inverse response evidence
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym64_vacuum_adapted_tower.py --check
      - name: Test nested blocks positive moments and physical leakage
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym64_vacuum_adapted_tower.py -v
      - name: Replay unchanged spatial blocking and gauge lattice results
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym63_spatial_blocking_scale.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym63_spatial_blocking_scale.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym62_gauge_lattice_gap.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym62_gauge_lattice_gap.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
