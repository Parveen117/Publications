name: YM82 nonlinear lattice spectral gaps

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym82-nonlinear-lattice-gap.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym82-nonlinear-lattice-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce nonlinear quantum and conditional block gap certificates
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym82_nonlinear_lattice_gap.py --check
      - name: Test nonlinear extrema, block geometry, native identities and claim boundaries
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym82_nonlinear_lattice_gap.py -v
      - name: Replay unchanged vacuum response and source dynamics
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym81_local_third_moment_vacuum_response.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym81_local_third_moment_vacuum_response.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym80_bounded_phase_energy_certificates.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym80_bounded_phase_energy_certificates.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym79_local_witness_survival_certificates.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym79_local_witness_survival_certificates.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym78_stationary_derivative_energy_survival.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym78_stationary_derivative_energy_survival.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym77_physical_smearing_continuum_survival.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym77_physical_smearing_continuum_survival.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym76_local_defect_weak_coupling_dynamics.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym76_local_defect_weak_coupling_dynamics.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym75_rh_source_resolved_transfer.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym75_rh_source_resolved_transfer.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
