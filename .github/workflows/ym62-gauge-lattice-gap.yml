name: YM62 native 3+1 gauge lattice gap

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - '.github/workflows/ym62-gauge-lattice-gap.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - '.github/workflows/ym62-gauge-lattice-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce exact gauge lattice and gap evidence
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym62_gauge_lattice_gap.py --check
      - name: Test gauge signs plaquette incidence and strict gap gates
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym62_gauge_lattice_gap.py -v
      - name: Replay the unchanged block history and response predecessors
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym53_anisotropic_interaction.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym53_anisotropic_interaction.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym60_interacting_histories_response.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym60_interacting_histories_response.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym61_source_response_collective.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym61_source_response_collective.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
