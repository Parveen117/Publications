name: YM60 interacting histories and response

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - '.github/workflows/ym60-interacting-histories-response.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - '.github/workflows/ym60-interacting-histories-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce exact interacting history and response evidence
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym60_interacting_histories_response.py --check
      - name: Test identities and spectral refusal controls
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym60_interacting_histories_response.py -v
      - name: Replay the unchanged scalar response and free history sources
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym59_scalar_vacuum_response.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym59_scalar_vacuum_response.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym58_infinite_volume_histories.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym58_infinite_volume_histories.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
