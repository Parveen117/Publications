name: YM89 gauge block contraction

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/nonlinear-spectral-blindness/**'
      - '.github/workflows/ym89-gauge-block-contraction.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/nonlinear-spectral-blindness/**'
      - '.github/workflows/ym89-gauge-block-contraction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce actual marginal and gauge block controls
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym89_gauge_block_contraction.py --check
      - name: Check native fibers, Schur bounds, walk tails and dynamic memory
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym89_gauge_block_contraction.py -v
      - name: Replay unchanged spatial and vacuum-adapted inputs
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym88_spatial_score_contraction.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym88_spatial_score_contraction.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym64_vacuum_adapted_tower.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym64_vacuum_adapted_tower.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code
