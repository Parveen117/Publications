name: YM70 certified spectral memory

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym70-certified-spectral-memory.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym70-certified-spectral-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce native Wilson memory and rational enclosures
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym70_certified_spectral_memory.py --check
      - name: Test singular moments, spectral bounds and nested cuts
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym70_certified_spectral_memory.py -v
      - name: Replay unchanged vacuum-adapted response tower
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym64_vacuum_adapted_tower.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym64_vacuum_adapted_tower.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
