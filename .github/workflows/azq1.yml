name: azq1-quantum-rung
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet azure-quantum qiskit qiskit-qir
      - name: run preregistered AZQ1
        env:
          AZQ_CONNECTION: ${{ secrets.AZQ_CONNECTION }}
        working-directory: papers/quantum-certified-verdicts/AZQ1
        run: |
          set +e
          python run_azq1.py > RUN_LOG.txt 2>&1
          echo "exit=$?" >> RUN_LOG.txt
          tail -40 RUN_LOG.txt
      - name: commit outputs (certificate or error log)
        if: always()
        run: |
          git config user.name "Monty Dabas"
          git config user.email "Parveen117@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -f papers/quantum-certified-verdicts/AZQ1/AZQ1_CERTIFICATE.json papers/quantum-certified-verdicts/AZQ1/RUN_LOG.txt 2>/dev/null || true
          git commit -m "AZQ1 run outputs (as they fell)" || echo "no change"
          git push || true
