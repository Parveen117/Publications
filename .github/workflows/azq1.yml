name: azq1-quantum-rung
on:
  workflow_dispatch:
    inputs:
      targets:
        description: comma-separated Azure targets
        default: quantinuum.sim.h2-1e,rigetti.sim.qvm
      cert:
        description: certificate filename
        default: AZQ1_CERTIFICATE.json
      workdir:
        description: campaign folder
        default: AZQ1
      script:
        description: runner script
        default: run_azq1.py
      angle:
        description: AZQ2 fault angle (rad)
        default: "0.60"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet azure-quantum qiskit qiskit-qir qsharp
      - name: run preregistered AZQ1
        env:
          AZQ_CONNECTION: ${{ secrets.AZQ_CONNECTION }}
          AZQ_TARGETS: ${{ inputs.targets }}
          AZQ_CERT: ${{ inputs.cert }}
          AZQ2_ANGLE: ${{ inputs.angle }}
        working-directory: papers/quantum-certified-verdicts/${{ inputs.workdir }}
        run: |
          set +e
          python ${{ inputs.script }} > RUN_LOG.txt 2>&1
          echo "exit=$?" >> RUN_LOG.txt
          tail -40 RUN_LOG.txt
      - name: Preserve run outputs for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azq1-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            papers/quantum-certified-verdicts/${{ inputs.workdir }}/AZQ1_CERTIFICATE.json
            papers/quantum-certified-verdicts/${{ inputs.workdir }}/AZQ1_R_CERTIFICATE.json
            papers/quantum-certified-verdicts/${{ inputs.workdir }}/AZQ2_CERTIFICATE.json
            papers/quantum-certified-verdicts/${{ inputs.workdir }}/AZQ2_B2_CERTIFICATE.json
            papers/quantum-certified-verdicts/${{ inputs.workdir }}/RUN_LOG.txt
          if-no-files-found: warn
