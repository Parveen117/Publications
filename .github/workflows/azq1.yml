name: azq1-quantum-rung
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet azure-quantum qiskit qiskit-qir
      - name: run preregistered AZQ1
        env:
          AZQ_CONNECTION: ${{ secrets.AZQ_CONNECTION }}
        working-directory: papers/quantum-certified-verdicts/AZQ1
        run: python run_azq1.py
      - name: commit certificate
        run: |
          git config user.name "Monty Dabas"
          git config user.email "Parveen117@users.noreply.github.com"
          git add papers/quantum-certified-verdicts/AZQ1/AZQ1_CERTIFICATE.json
          git commit -m "AZQ1 certificate: results as they fell (Actions run)" || echo "no change"
          git push
