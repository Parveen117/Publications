name: azq1-quantum-rung
on:
  workflow_dispatch:
    inputs:
      targets:
        description: comma-separated Azure targets
        default: quantinuum.sim.h2-1e,rigetti.sim.qvm
      cert:
        description: certificate filename
        default: AZQ1_CERTIFICATE.json
      workdir:
        description: campaign folder
        default: AZQ1
      script:
        description: runner script
        default: run_azq1.py
      angle:
        description: AZQ2 fault angle (rad)
        default: "0.60"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet azure-quantum qiskit qiskit-qir qsharp
      - name: run preregistered AZQ1
        env:
          AZQ_CONNECTION: ${{ secrets.AZQ_CONNECTION }}
          AZQ_TARGETS: ${{ inputs.targets }}
          AZQ_CERT: ${{ inputs.cert }}
          AZQ2_ANGLE: ${{ inputs.angle }}
        working-directory: papers/quantum-certified-verdicts/${{ inputs.workdir }}
        run: |
          set +e
          python ${{ inputs.script }} > RUN_LOG.txt 2>&1
          echo "exit=$?" >> RUN_LOG.txt
          tail -40 RUN_LOG.txt
      - name: upload outputs via contents API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for F in AZQ1_CERTIFICATE.json AZQ1_R_CERTIFICATE.json AZQ2_CERTIFICATE.json AZQ2_B2_CERTIFICATE.json RUN_LOG.txt; do
            P="papers/quantum-certified-verdicts/${{ inputs.workdir }}/$F"
            [ -f "$P" ] || continue
            B64=$(base64 -w0 "$P")
            SHA=$(curl -s -H "Authorization: token $GH_TOKEN"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$P?ref=main"               | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('sha',''))")
            BODY=$(python3 - "$B64" "$SHA" <<PYEOF
          import json,sys
          b64,sha=sys.argv[1],sys.argv[2]
          d={"message":"AZQ1 run outputs (as they fell)","content":b64,"branch":"main"}
          if sha: d["sha"]=sha
          print(json.dumps(d))
          PYEOF
          )
            curl -s -X PUT -H "Authorization: token $GH_TOKEN"               -d "$BODY" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$P"               | python3 -c "import json,sys;d=json.load(sys.stdin);print('$F ->', d.get('commit',{}).get('sha', d.get('message')))"
          done
