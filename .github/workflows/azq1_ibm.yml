name: azq1-ibm-real-hardware
on:
  workflow_dispatch:
    inputs:
      script:
        description: runner script
        default: run_azq1_ibm.py
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet qiskit qiskit-ibm-runtime
      - name: run preregistered AZQ1-I
        env:
          IBM_TOKEN: ${{ secrets.IBM_TOKEN }}
        working-directory: papers/quantum-certified-verdicts/AZQ1
        run: |
          set +e
          python ${{ inputs.script }} > RUN_LOG_IBM.txt 2>&1
          echo "exit=$?" >> RUN_LOG_IBM.txt
          tail -30 RUN_LOG_IBM.txt
      - name: Preserve run outputs for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azq1-ibm-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            papers/quantum-certified-verdicts/AZQ1/AZQ1_I_CERTIFICATE.json
            papers/quantum-certified-verdicts/AZQ1/AZQ1_I2_CERTIFICATE.json
            papers/quantum-certified-verdicts/AZQ1/AZQ1_I3_CERTIFICATE.json
            papers/quantum-certified-verdicts/AZQ1/AZQ1_I3_PRECOMMIT.json
            papers/quantum-certified-verdicts/AZQ1/AZQ1_I3B_CERTIFICATE.json
            papers/quantum-certified-verdicts/AZQ1/AZQ1_I3B_PRECOMMIT.json
            papers/quantum-certified-verdicts/AZQ1/RUN_LOG_IBM.txt
          if-no-files-found: warn
