name: Native compact gauge completion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compact-gauge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Publications
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publications
          persist-credentials: false
      - name: Checkout canonical RKF engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Parveen117/Recognition-Kernel-Framework
          ref: 3cc5a33b05c16d59c90994ddda69dedc0d392424
          path: rkf
          persist-credentials: false
          sparse-checkout: |
            operator_foundation
      - name: Checkout pinned physics research sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Parveen117/Publications
          ref: f0f1c1650e914b7eaf3bf64ddb7df9f543c92a56
          path: physics
          persist-credentials: false
          sparse-checkout: |
            papers/ugd-kahler-propagation
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Exact native and independent controls
        run: |
          bash publications/papers/native-compact-gauge/verify.sh \
            --rkf-root rkf --physics-root physics --check
