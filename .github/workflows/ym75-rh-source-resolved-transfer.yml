name: YM75 RH source resolved spectral transfer

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym75-rh-source-resolved-transfer.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym75-rh-source-resolved-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce source resolved cube, residual memory and stable recovery
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym75_rh_source_resolved_transfer.py --check
      - name: Test exact spectral transfer and scope controls
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym75_rh_source_resolved_transfer.py -v
      - name: Replay unchanged electric cutoff and physical memory bounds
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym74_all_coupling_electric_enclosures.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym74_all_coupling_electric_enclosures.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym73_physical_mass_memory_metric.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym73_physical_mass_memory_metric.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
