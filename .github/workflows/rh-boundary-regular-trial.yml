name: BRT-1 RH positivity packets

on:
  push:
    branches: [main]
    paths:
      - 'proof_lab/rh_l055/**'
      - 'proof_lab/rh_l075/**'
      - 'RH_BOUNDARY_REGULAR_TRIAL.md'
      - '.github/workflows/rh-boundary-regular-trial.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proof_lab/rh_l055/**'
      - 'proof_lab/rh_l075/**'
      - 'RH_BOUNDARY_REGULAR_TRIAL.md'
      - '.github/workflows/rh-boundary-regular-trial.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'also rerun the L=9/10, 19/20 and 1 certificates (one to two hours)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the ball-arithmetic engine dependency
        run: python -m pip install python-flint==0.9.0
      - name: Check engine hashes and rerun the fast packets with both engines
        run: python -B proof_lab/rh_l075/ci_check.py
      - name: Evidence stays read-only
        run: git diff --exit-code -- proof_lab

  reproduce-full:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the ball-arithmetic engine dependency
        run: python -m pip install python-flint==0.9.0
      - name: Rerun every packet including the L=9/10, 19/20 and 1 certificates
        run: python -B proof_lab/rh_l075/ci_check.py --full
      - name: Evidence stays read-only
        run: git diff --exit-code -- proof_lab
