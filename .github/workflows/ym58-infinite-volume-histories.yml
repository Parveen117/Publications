name: YM58 infinite volume histories

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - '.github/workflows/ym58-infinite-volume-histories.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - '.github/workflows/ym58-infinite-volume-histories.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce exact infinite-volume marginal evidence
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym58_infinite_volume_histories.py --check
      - name: Test local histories, boundary noise, gap and refinement controls
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym58_infinite_volume_histories.py -v
      - name: Replay the unchanged native gap sources
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym57_neighbour_turn_gap.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym57_neighbour_turn_gap.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym56_lambda_curvature_gap.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym56_lambda_curvature_gap.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
