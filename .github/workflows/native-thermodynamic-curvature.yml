name: Native thermodynamic curvature

on:
  push:
    branches: [main]
    paths:
      - papers/native-thermodynamic-curvature/**
      - .github/workflows/native-thermodynamic-curvature.yml
  pull_request:
    branches: [main]
    paths:
      - papers/native-thermodynamic-curvature/**
      - .github/workflows/native-thermodynamic-curvature.yml

permissions:
  contents: read

jobs:
  certify:
    name: Native words, independent Christoffel route and failure controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publications
          persist-credentials: false
      - name: Checkout the canonical source and unchanged engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Parveen117/Recognition-Kernel-Framework
          ref: 3cc5a33b05c16d59c90994ddda69dedc0d392424
          path: rkf
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            operator_foundation/core/
            operator_foundation/examples/emk_job.json
            operator_foundation/CANONICAL_HOME.json
            operator_foundation/theory/01_NATIVE_ALGEBRA.md
            operator_foundation/theory/02_COMPLETION_AND_MEMORY.md
            operator_foundation/sources/rkf_reference/theorum/thermodynamics/
            operator_foundation/sources/rkf_reference/theorum/42_cut_graded_lambda_jacobian_tower_theorem.md
            operator_foundation/sources/rkf_reference/theorum/singularity_calculus/05_seam_stokes_memory.md
      - name: Checkout the actual thermo research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Parveen117/Publications
          ref: f0f1c1650e914b7eaf3bf64ddb7df9f543c92a56
          path: thermo-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            papers/thermodynamic-response-corrections/
            papers/thermo-compass-foundations/THEOREM.md
            papers/thermo-phase-field/THEOREM.md
            papers/coherence-first-thermodynamics/THEOREM.md
            papers/ugd-kahler-propagation/THERMO_GAUGE_COMPLETION.md
            papers/uncut-cut-measurement/THERMODYNAMIC_FOUNDATION_BRIDGE.md
      - name: Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Python exact controls
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read-only source, proof and artifact checks
        run: |
          bash publications/papers/native-thermodynamic-curvature/verify.sh \
            --rkf-root rkf --thermo-root thermo-source --check
