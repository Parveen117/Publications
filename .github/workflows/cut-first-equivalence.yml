name: Cut-First Equivalence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: python -m pip install pytest
      - name: Regenerate CFE-1/CFE-2/CFE-Q certificates and check pins
        run: |
          python papers/cut-first-equivalence/certificates/cfe1_cut_first_equivalence.py
          python papers/cut-first-equivalence/certificates/cfe2_surjectivity.py
          python papers/cut-first-equivalence/certificates/cfeq_quantum_witness.py
          python papers/cut-first-equivalence/certificates/cfeu_uniqueness.py
          git diff --exit-code papers/cut-first-equivalence/certificates
      - name: Tests
        run: python -m pytest papers/cut-first-equivalence/tests -v
