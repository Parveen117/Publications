name: Lambda seam calibration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: python -m pip install pytest
      - name: Regenerate LAM1-LAM3 certificates and check pins
        run: |
          python papers/lambda-seam-calibration/certificates/lam1_seam_interface.py
          python papers/lambda-seam-calibration/certificates/lam2_derived_phase.py
          python papers/lambda-seam-calibration/certificates/lam3_crossing_derivation.py
          git diff --exit-code papers/lambda-seam-calibration/certificates
      - name: Tests
        run: python -m pytest papers/lambda-seam-calibration/tests -v
