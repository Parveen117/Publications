name: Native phase observation certification

on:
  push:
    branches: [main]
    paths:
      - 'Native_Phase_Memory_Development_Draft.tex'
      - 'Native_Angular_Current_Development_Draft.tex'
      - 'papers/Clock_Free_*'
      - 'papers/Clock_Relation_Reconstruction*'
      - 'papers/Native_Phase_Word_Reconstruction*'
      - 'papers/native-phase-observation-certification/**'
      - 'papers/generalized-euler-evolution/GE2_CLOCK_FREE_RECOGNITION_GENERATOR.md'
      - 'papers/emk-ugd-algebra/CONNECTION_CALCULUS.md'
      - '.github/workflows/native-phase-observation-certification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Native_Phase_Memory_Development_Draft.tex'
      - 'Native_Angular_Current_Development_Draft.tex'
      - 'papers/Clock_Free_*'
      - 'papers/Clock_Relation_Reconstruction*'
      - 'papers/Native_Phase_Word_Reconstruction*'
      - 'papers/native-phase-observation-certification/**'
      - 'papers/generalized-euler-evolution/GE2_CLOCK_FREE_RECOGNITION_GENERATOR.md'
      - 'papers/emk-ugd-algebra/CONNECTION_CALCULUS.md'
      - '.github/workflows/native-phase-observation-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-phase-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Publications
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pinned native runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Replay all uploaded packets and new native certificates
        run: python3.12 papers/native-phase-observation-certification/verify.py --check
