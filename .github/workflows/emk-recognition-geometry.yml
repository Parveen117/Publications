name: EMK recognition geometry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: python -m pip install pytest
      - name: Regenerate EMK-G1 certificate and check pin
        run: |
          python papers/emk-recognition-geometry/certificates/emkg1_rotational_seam_metric.py
          python papers/emk-recognition-geometry/certificates/emkg2_global_quotient_holonomy.py
          git diff --exit-code papers/emk-recognition-geometry/certificates
      - name: Tests
        run: python -m pytest papers/emk-recognition-geometry/tests -v
