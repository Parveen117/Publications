name: Curvature information duality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: python -m pip install pytest
      - name: Regenerate CID-1 certificate and check pin
        run: |
          python papers/curvature-information-duality/certificates/cid1_curvature_information_duality.py
          git diff --exit-code papers/curvature-information-duality/certificates
      - name: Tests
        run: python -m pytest papers/curvature-information-duality/tests -v
