name: Yang-Mills certified benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: python -m pip install pytest mpmath
      - name: Regenerate YM1 certificate and check pin
        run: |
          python papers/yang-mills-certified-benchmark/certificates/ym12_square_sourced.py
          python papers/yang-mills-certified-benchmark/certificates/ym13_beta_audit.py
          python papers/yang-mills-certified-benchmark/certificates/ym14_overlap_dock.py
          python papers/yang-mills-certified-benchmark/certificates/ym15_chain_closed_form.py
          python papers/yang-mills-certified-benchmark/certificates/ym16_chain_dock.py
          python papers/yang-mills-certified-benchmark/certificates/ym17_interleaving_seam.py
          python papers/yang-mills-certified-benchmark/certificates/ym18_vacuum_tracking.py
          python papers/yang-mills-certified-benchmark/certificates/ym19_dobrushin_dock.py
          python papers/yang-mills-certified-benchmark/certificates/ym20_native_origin_audit.py
          python papers/yang-mills-certified-benchmark/certificates/ymf1_chain_fabric.py
          python papers/yang-mills-certified-benchmark/certificates/ym21_tiling_law.py
          python papers/yang-mills-certified-benchmark/certificates/ym22_cutoff_tiling_rate.py
          python papers/yang-mills-certified-benchmark/certificates/ym23_weak_coupling_turn.py
          python papers/yang-mills-certified-benchmark/certificates/ym24_abelian_subfabric.py
          python papers/yang-mills-certified-benchmark/certificates/ym25_direction_change.py
          python papers/yang-mills-certified-benchmark/certificates/ym26_theorum28_dock.py
          python papers/yang-mills-certified-benchmark/certificates/ym27_rh_framework_dock.py
          python papers/yang-mills-certified-benchmark/certificates/ym28_e4d_on_chain.py
          python papers/yang-mills-certified-benchmark/certificates/ym29_vacuum_floor.py
          python papers/yang-mills-certified-benchmark/certificates/ym30_recoupling_engine.py
          python papers/yang-mills-certified-benchmark/certificates/ym31_uniform_floor.py
          python papers/yang-mills-certified-benchmark/certificates/ym32_dressed_excitation.py
          python papers/yang-mills-certified-benchmark/certificates/ym33_t_row_engine.py
          python papers/yang-mills-certified-benchmark/certificates/ym34_e4dc_restated.py
          python papers/yang-mills-certified-benchmark/certificates/ym35_commutator_remainder.py
          python papers/yang-mills-certified-benchmark/certificates/ym36_face_word_carrier.py
          python papers/yang-mills-certified-benchmark/certificates/ym38_native_uniformity.py
          python papers/yang-mills-certified-benchmark/certificates/ym39_content_ladder.py
          git diff --exit-code papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM1.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM2.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM3.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM4.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM5.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM6.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM7.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM8.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM9.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM10.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM11.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM12.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM13.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM14.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM15.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM16.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM17.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM18.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM19.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM20.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YMF1.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM21.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM22.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM23.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM24.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM25.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM26.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM27.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM28.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM29.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM30.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM31.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM32.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM33.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM34.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM35.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM36.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM38.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM39.sha256
      - name: YM37 space transfer (own step, ~16 min)
        run: |
          python papers/yang-mills-certified-benchmark/certificates/ym37_space_transfer.py
          git diff --exit-code papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM37.sha256
      - name: Install pytest
        run: python -m pip install pytest mpmath
      - name: Tests
        run: python -m pytest papers/yang-mills-certified-benchmark/tests -v
