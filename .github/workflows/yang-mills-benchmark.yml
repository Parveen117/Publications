name: Yang-Mills certified benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regenerate YM1 certificate and check pin
        run: |
          python papers/yang-mills-certified-benchmark/certificates/ym12_square_sourced.py
          python papers/yang-mills-certified-benchmark/certificates/ym13_beta_audit.py
          python papers/yang-mills-certified-benchmark/certificates/ym14_overlap_dock.py
          python papers/yang-mills-certified-benchmark/certificates/ym15_chain_closed_form.py
          python papers/yang-mills-certified-benchmark/certificates/ym16_chain_dock.py
          python papers/yang-mills-certified-benchmark/certificates/ym17_interleaving_seam.py
          python papers/yang-mills-certified-benchmark/certificates/ym18_vacuum_tracking.py
          python papers/yang-mills-certified-benchmark/certificates/ym19_dobrushin_dock.py
          git diff --exit-code papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM1.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM2.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM3.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM4.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM5.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM6.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM7.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM8.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM9.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM10.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM11.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM12.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM13.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM14.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM15.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM16.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM17.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM18.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM19.sha256
      - name: Install pytest
        run: python -m pip install pytest
      - name: Tests
        run: python -m pytest papers/yang-mills-certified-benchmark/tests -v
