name: Yang-Mills certified benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regenerate YM1 certificate and check pin
        run: |
          python papers/yang-mills-certified-benchmark/certificates/ym10_blindness_ledger.py
          git diff --exit-code papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM1.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM2.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM3.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM4.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM5.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM6.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM7.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM8.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM9.sha256 papers/yang-mills-certified-benchmark/certificates/EXPECTED_YM10.sha256
      - name: Install pytest
        run: python -m pip install pytest
      - name: Tests
        run: python -m pytest papers/yang-mills-certified-benchmark/tests -v
