name: YM56 lambda curvature and gap

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - 'papers/native-thermodynamic-curvature/THEOREM.md'
      - '.github/workflows/ym56-lambda-curvature-gap.yml'
  pull_request:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/native-compact-gauge/**'
      - 'papers/native-thermodynamic-curvature/THEOREM.md'
      - '.github/workflows/ym56-lambda-curvature-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check the exact lambda certificate without writing
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym56_lambda_curvature_gap.py --check
      - name: Test the Hessian, symmetry, sharp modes and inherited chain gate
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym56_lambda_curvature_gap.py -v
      - name: Replay the response and joint-limit dependencies
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym54_response_protocol.py --check
          python -B papers/yang-mills-certified-benchmark/certificates/ym55_anisotropic_joint_limit.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym52_energy_observer.py -v
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym54_response_protocol.py -v
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym55_anisotropic_joint_limit.py -v
      - name: Evidence stays read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
