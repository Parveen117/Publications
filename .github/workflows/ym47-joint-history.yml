name: YM47 joint local history limit

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/emk-ugd-algebra/certificates/emkt2_time_ordered_transport.py'
      - '.github/workflows/ym47-joint-history.yml'
  pull_request:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/emk-ugd-algebra/certificates/emkt2_time_ordered_transport.py'
      - '.github/workflows/ym47-joint-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild normalized joint-limit evidence without writing
        run: python papers/yang-mills-certified-benchmark/certificates/ym47_joint_history.py --check
      - name: Test vacuum replacement, histories, summable tails and cropping
        run: python -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym47_joint_history.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
