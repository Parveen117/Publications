name: GE1 Generalized Euler evolution

on:
  push:
    branches: [main]
    paths:
      - 'papers/generalized-euler-evolution/**'
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/generalized-euler-evolution.yml'
  pull_request:
    branches: [main]
    paths:
      - 'papers/generalized-euler-evolution/**'
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/generalized-euler-evolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild scoped domain and native heat evidence without writing
        run: python -B papers/generalized-euler-evolution/certificates/ge1_evolution.py --check
      - name: Check domain counterexamples, stable steps and native coefficient actions
        run: python -B -m unittest discover -s papers/generalized-euler-evolution/tests -v
      - name: Replay unchanged heat selection and compact energy predecessors
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym51_heat_selection.py --check
          python -B papers/yang-mills-certified-benchmark/certificates/ym52_energy_observer.py --check
      - name: Evidence stays read-only
        run: git diff --exit-code -- papers/generalized-euler-evolution papers/yang-mills-certified-benchmark
