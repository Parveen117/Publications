name: YM68 averaged infinite-exterior locality

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym68-averaged-exterior-locality.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/ym68-averaged-exterior-locality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce averaged conditioning and Fisher evidence
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym68_averaged_exterior_locality.py --check
      - name: Test infinite-exterior budgets and rare-pin obstructions
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym68_averaged_exterior_locality.py -v
      - name: Replay unchanged native derivatives and spatial covariance
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym67_pointwise_coarse_vacuum.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym67_pointwise_coarse_vacuum.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym65_spatial_response_locality.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym65_spatial_response_locality.py -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/yang-mills-certified-benchmark
