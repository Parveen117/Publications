name: GE4 Native observer recovery

on:
  push:
    branches: [main]
    paths:
      - 'papers/generalized-euler-evolution/**'
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/native-observer-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'papers/generalized-euler-evolution/**'
      - 'papers/yang-mills-certified-benchmark/**'
      - '.github/workflows/native-observer-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild native observer recovery without writing
        run: python -B papers/generalized-euler-evolution/certificates/ge4_observer_recovery.py --check
      - name: Replay frozen memory predecessor and all Generalized Euler tests
        run: |
          python -B papers/generalized-euler-evolution/certificates/ge3_returning_memory.py --check
          python -B -m unittest discover -s papers/generalized-euler-evolution/tests -v
      - name: Evidence stays read-only
        run: git diff --exit-code -- papers/generalized-euler-evolution papers/yang-mills-certified-benchmark
