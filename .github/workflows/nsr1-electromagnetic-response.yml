name: NSR1 electromagnetic response

on:
  push:
    branches: [main]
    paths:
      - 'papers/native-symmetry-response/**'
      - 'papers/native-thermodynamic-curvature/**'
      - 'papers/emk-ugd-algebra/CONNECTION_CALCULUS.md'
      - '.github/workflows/nsr1-electromagnetic-response.yml'
  pull_request:
    paths:
      - 'papers/native-symmetry-response/**'
      - 'papers/native-thermodynamic-curvature/**'
      - 'papers/emk-ugd-algebra/CONNECTION_CALCULUS.md'
      - '.github/workflows/nsr1-electromagnetic-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check exact electromagnetic and symmetry evidence
        run: python -B papers/native-symmetry-response/certificates/nsr1_response.py --check
      - name: Test response, waves, symmetry and internal-mode controls
        run: python -B -m unittest discover -s papers/native-symmetry-response/tests -v
      - name: Evidence remains read-only
        run: git diff --exit-code -- papers/native-symmetry-response papers/native-thermodynamic-curvature
