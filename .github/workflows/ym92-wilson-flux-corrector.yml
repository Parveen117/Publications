name: YM92 Wilson flux corrector

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/nonlinear-spectral-blindness/**'
      - '.github/workflows/ym92-wilson-flux-corrector.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/nonlinear-spectral-blindness/**'
      - '.github/workflows/ym92-wilson-flux-corrector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce the actual Wilson flux certificate
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym92_wilson_flux_corrector.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym92_wilson_flux_corrector.py -v
      - name: Replay the inherited tensor and conditional-memory inputs
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym88_spatial_score_contraction.py --check
          python -B papers/yang-mills-certified-benchmark/certificates/ym91_conditional_memory_flux.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym88_spatial_score_contraction.py -v
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym91_conditional_memory_flux.py -v
          python -B papers/nonlinear-spectral-blindness/certificates/nsb2_nonlinear_response.py --check
      - name: All evidence remains read-only
        run: git diff --exit-code
