name: YM90 gauge memory bound

on:
  push:
    branches: [main]
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/nonlinear-spectral-blindness/**'
      - '.github/workflows/ym90-gauge-memory-bound.yml'
  pull_request:
    paths:
      - 'papers/yang-mills-certified-benchmark/**'
      - 'papers/nonlinear-spectral-blindness/**'
      - '.github/workflows/ym90-gauge-memory-bound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce the actual dynamic memory bound and native controls
        run: python -B papers/yang-mills-certified-benchmark/certificates/ym90_gauge_memory_bound.py --check
      - name: Check selected sectors, full tails, resolvents, and scope
        run: python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym90_gauge_memory_bound.py -v
      - name: Replay unchanged static, pointwise, and dynamic inputs
        run: |
          python -B papers/yang-mills-certified-benchmark/certificates/ym89_gauge_block_contraction.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym89_gauge_block_contraction.py -v
          python -B papers/yang-mills-certified-benchmark/certificates/ym88_spatial_score_contraction.py --check
          python -B papers/yang-mills-certified-benchmark/certificates/ym64_vacuum_adapted_tower.py --check
          python -B -m unittest discover -s papers/yang-mills-certified-benchmark/tests -p test_ym64_vacuum_adapted_tower.py -v
